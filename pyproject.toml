[build-system]
requires = ["setuptools>=40.8.0", "wheel", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PyOptik"
dynamic = ["version"]
description = "A package for refractive index values."
license = {file = "LICENSE"}
readme = "README.rst"
requires-python = ">=3.10"
authors = [{ name="Martin Poinsinet de Sivry-Houle", email="martin.poinsinet.de.sivry@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3.14",
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: Implementation :: CPython',
    'Development Status :: 4 - Beta',
    'Topic :: Scientific/Engineering :: Physics',
    'Intended Audience :: Science/Research',
]

keywords = ["refractive index", "optics"]

dependencies = [
    "pint ~=0.24",
    "numpy",
    "matplotlib ~=3.8",
    "requests ~=2.31",
    "pyyaml ~=6.0",
    "tabulate ~=0.9",
    "TypedUnit>=0.2.9"
]

[project.scripts]
pyoptik = "PyOptik.__main__:main"

[tool.setuptools]
packages = {find = {where = ["."], include = ["PyOptik*"]}}
include-package-data = true


[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"

[project.optional-dependencies]
testing = [
    "pytest >=7.4,<9.0",
    "pytest-cov >=2,<6",
    "pytest-json-report ~=1.5",
    "coverage ~=7.6"
]


documentation = [
    "MartinPdeS-docs>=0.2.5,<0.3",
]

dev = [
    "flake8 ==7.1.1",
]

ui = [
    "textual >=1.0",
]
