name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    uses: MartinPdeS/MPSActions/.github/workflows/run_tests.yml@v15
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      install-command: >-
        python -m pip install --upgrade pip && python -m pip install -e '.[testing]'
      test-command: python -m pytest -m 'not network' --cov=PyOptik --cov-report=term-missing
