name: Documentation
'on':
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
permissions:
  contents: read
jobs:
  documentation:
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: MartinPdeS/MPSActions/.github/workflows/publish_documentation.yml@v13
    with:
      python-version: '3.11'
      package-name: PyOptik
      apt-package: xvfb jq
      deploy-pages: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      debug: true
