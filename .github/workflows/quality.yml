name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    uses: MartinPdeS/MPSActions/.github/workflows/run_quality.yml@v13
    with:
      install-command: python -m pip install "flake8==7.1.1"
      quality-command: python -m flake8 PyOptik tests
