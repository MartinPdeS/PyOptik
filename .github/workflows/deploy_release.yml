name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: MartinPdeS/MPSActions/.github/workflows/publish_release.yml@v15
    with:
      documentation: true
      documentation_package_name: PyOptik
      documentation_python_version: "3.11"
      documentation_apt_package: xvfb jq
      debug: true
      pypi_package_type: pure
      pypi_python_version: "3.11"
      pypi_test_import: PyOptik
      conda_python_versions: '["3.14"]'
      conda_os_list: '["ubuntu-latest"]'
      conda_package_name: pyoptik
      conda_recipe_path: conda.recipe
      conda_test_import: PyOptik
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
